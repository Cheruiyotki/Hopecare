<!DOCTYPE html>
<html lang="en">
<head>
    <title>View Profile - HopeCare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6767AC',
                        secondary: '#4A90E2',
                        action: '#5D5CDE',
                        background: '#FDFDFF',
                        typography: '#2D3436',
                        success: '#55B985',
                        accent: '#6767AC',
                    }
                }
            }
        }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-image: url(../static/images/image1.webp);
            background-size: cover;
            min-height: 100vh;
        }
    </style>
</head>
<body class="bg-background">

    <!-- Navigation -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center">
                    <h2 class="text-3xl font-bold text-primary">HopeCare</h2>
                </div>
                <div class="flex items-center space-x-8">
                    <a href="{{ url_for('home') }}" class="text-typography hover:text-primary font-medium text-lg transition">HOME</a>
                    <a href="{{ url_for('admin_dashboard') }}" class="text-typography hover:text-primary font-medium text-lg transition">DASHBOARD</a>
                    <a href="{{ url_for('logout') }}" class="text-typography hover:text-primary font-medium text-lg transition">LOGOUT</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Profile Section -->
    <div class="container py-16">
        <div class="max-w-2xl mx-auto">
            <div class="bg-white rounded-2xl shadow-xl p-8">
                <h2 class="text-3xl font-bold text-primary mb-8 text-center">Admin Profile</h2>
                <div class="space-y-6">
                    <div>
                        <p class="text-primary font-bold text-lg">Username:</p>
                        <p class="text-typography text-xl mt-1">{{ profile[0] }}</p>
                    </div>
                    <div>
                        <p class="text-primary font-bold text-lg">User Type:</p>
                        <p class="text-typography text-xl mt-1">{{ profile[1] }}</p>
                    </div>
                </div>
                <div class="flex gap-4 mt-8">
                    <a href="{{ url_for('edit_profile') }}" class="bg-action text-white px-8 py-3 rounded-xl font-semibold text-lg hover:bg-primary transition shadow-lg">
                        Edit Profile
                    </a>
                    <a href="{{ url_for('admin_dashboard') }}" class="border-2 border-typography text-typography px-8 py-3 rounded-xl font-semibold text-lg hover:bg-typography hover:text-white transition">
                        Back to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
