<!DOCTYPE html>
<html lang="en">
<head>
    <title>Upload Report - HopeCare</title>
    <link rel="stylesheet" href="../static/home.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <style>
        body {
            background-image: url(../static/images/image1.webp);
            background-size: cover;
            min-height: 100vh;
        }
        .form-container {
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 10px;
            margin-top: 50px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .form-container h2 {
            color: #ff7200;
            margin-bottom: 30px;
        }
        .form-label {
            color: #fff;
        }
        .form-control {
            background: transparent;
            border: 1px solid #ff7200;
            color: #fff;
        }
        .form-control:focus {
            background: rgba(255, 114, 0, 0.1);
            border-color: #ff7200;
            color: #fff;
        }
        .btn-primary {
            background: #ff7200;
            border: none;
            padding: 10px 30px;
        }
        .btn-primary:hover {
            background: #e65a00;
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid #fff;
            color: #fff;
            padding: 10px 30px;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="main">
        <div class="navbar">
            <div class="icon">
                <h2 class="logo">HopeCare</h2>
            </div>
            <div class="menu">
                <ul>
                    <li><a href="{{ url_for('home') }}">HOME</a></li>
                    <li><a href="{{ url_for('logout') }}">LOGOUT</a></li>
                </ul>
            </div>
        </div> 
        
        <div class="container">
            <div class="form-container">
                <h2>Upload Medical Report</h2>
                <form method="POST" action="{{ url_for('upload_report', patient_id=patient[0]) }}" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Patient Name</label>
                        <input type="text" class="form-control" value="{{ patient[1] }}" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Select Medical Report (PDF, JPG, PNG)</label>
                        <input type="file" class="form-control" name="report" accept=".pdf,.jpg,.jpeg,.png" required>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Upload Report</button>
                        <a href="{{ url_for('patient_history', patient_id=patient[0]) }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
