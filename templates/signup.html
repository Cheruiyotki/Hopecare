<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - HopeCare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6767AC',
                        secondary: '#4A90E2',
                        action: '#5D5CDE',
                        background: '#FDFDFF',
                        typography: '#2D3436',
                        success: '#55B985',
                        accent: '#6767AC',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #F8F9FF 0%, #E0E7FF 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="flex items-center justify-center">

    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <h1 class="text-4xl font-bold text-primary mb-8 text-center">Sign Up</h1>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="mb-4 p-4 rounded-xl {% if category == 'error' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <form method="post" action="{{ url_for('signup') }}">
                <div class="mb-6">
                    <label for="username" class="block text-typography font-semibold mb-2">Username:</label>
                    <input type="text" id="username" name="username" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-primary focus:outline-none bg-white text-typography" required>
                </div>
                <div class="mb-6">
                    <label for="password" class="block text-typography font-semibold mb-2">Password:</label>
                    <input type="password" id="password" name="password" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-primary focus:outline-none bg-white text-typography" required>
                </div>
                <div class="mb-6">
                    <label for="user_type" class="block text-typography font-semibold mb-2">User Type:</label>
                    <select id="user_type" name="user_type" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-primary focus:outline-none bg-white text-typography" required>
                        <option value="">Select user type</option>
                        <option value="patient">Patient</option>
                        <option value="doctor">Doctor</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-action text-white px-6 py-3 rounded-xl font-semibold text-lg hover:bg-primary transition shadow-lg">
                    Sign Up
                </button>
            </form>
            <p class="mt-6 text-center text-typography">Already have an account? <a href="{{ url_for('login') }}" class="text-primary hover:text-action font-semibold">Login</a></p>
        </div>
    </div>

</body>
</html>
