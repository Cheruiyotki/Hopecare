<!DOCTYPE html>
<html lang="en">
<head>
    <title>Update Diagnosis - HopeCare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6767AC',
                        secondary: '#4A90E2',
                        action: '#5D5CDE',
                        background: '#FDFDFF',
                        typography: '#2D3436',
                        success: '#55B985',
                        accent: '#6767AC',
                    }
                }
            }
        }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #FDFDFF 0%, #E0E7FF 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="bg-background">

    <!-- Navigation -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center">
                    <h2 class="text-3xl font-bold text-primary">HopeCare</h2>
                </div>
                <div class="flex items-center space-x-8">
                    <a href="{{ url_for('home') }}" class="text-typography hover:text-primary font-medium text-lg transition">HOME</a>
                    <a href="{{ url_for('logout') }}" class="text-typography hover:text-primary font-medium text-lg transition">LOGOUT</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Content Section -->
    <div class="container py-16">
        <div class="max-w-2xl mx-auto">
            <div class="bg-white rounded-2xl shadow-xl p-8">
                <h2 class="text-3xl font-bold text-primary mb-8 text-center">Update Patient Diagnosis</h2>
                
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="mb-4 p-4 rounded-xl {% if category == 'error' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                
                <form method="POST" action="{{ url_for('update_diagnosis', patient_id=patient_id) }}">
                    <div class="mb-6">
                        <label class="block text-typography font-semibold mb-3 text-lg">Diagnosis</label>
                        <textarea class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-primary focus:outline-none bg-white text-typography" name="diagnosis" rows="5" required>{{ diagnosis if diagnosis else '' }}</textarea>
                    </div>
                    <div class="flex gap-4">
                        <button type="submit" class="bg-action text-white px-8 py-3 rounded-xl font-semibold text-lg hover:bg-primary transition shadow-lg">
                            Update Diagnosis
                        </button>
                        <a href="{{ url_for('view_patients') }}" class="border-2 border-typography text-typography px-8 py-3 rounded-xl font-semibold text-lg hover:bg-typography hover:text-white transition">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
