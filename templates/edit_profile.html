<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Profile - HopeCare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6767AC',
                        secondary: '#4A90E2',
                        action: '#5D5CDE',
                        background: '#F8F9FF',
                        typography: '#2D3436',
                        success: '#55B985',
                        accent: '#E0E7FF',
                    }
                }
            }
        }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-image: url(../static/images/image1.webp);
            background-size: cover;
            min-height: 100vh;
        }
    </style>
</head>
<body class="bg-background">

    <!-- Navigation -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center">
                    <h2 class="text-3xl font-bold text-primary">HopeCare</h2>
                </div>
                <div class="flex items-center space-x-8">
                    <a href="{{ url_for('home') }}" class="text-typography hover:text-primary font-medium text-lg transition">HOME</a>
                    <a href="{{ url_for('admin_dashboard') }}" class="text-typography hover:text-primary font-medium text-lg transition">DASHBOARD</a>
                    <a href="{{ url_for('logout') }}" class="text-typography hover:text-primary font-medium text-lg transition">LOGOUT</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Form Section -->
    <div class="container py-16">
        <div class="max-w-2xl mx-auto">
            <div class="bg-white rounded-2xl shadow-xl p-8">
                <h2 class="text-3xl font-bold text-primary mb-8 text-center">Edit Admin Profile</h2>
                <form method="POST" action="{{ url_for('edit_profile') }}">
                    <div class="mb-6">
                        <label class="block text-typography font-semibold mb-2">Username</label>
                        <input type="text" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-primary focus:outline-none bg-white text-typography" name="username" value="{{ profile[0] }}" required>
                    </div>
                    <div class="mb-6">
                        <label class="block text-typography font-semibold mb-2">Password</label>
                        <input type="password" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-primary focus:outline-none bg-white text-typography" name="password" value="{{ profile[1] }}" required>
                    </div>
                    <div class="flex gap-4">
                        <button type="submit" class="bg-action text-white px-8 py-3 rounded-xl font-semibold text-lg hover:bg-primary transition shadow-lg">
                            Save Changes
                        </button>
                        <a href="{{ url_for('view_profile') }}" class="border-2 border-typography text-typography px-8 py-3 rounded-xl font-semibold text-lg hover:bg-typography hover:text-white transition">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
