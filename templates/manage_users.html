{% extends 'admin_dashboard.html' %}
{% block content %}
<h2 class="text-3xl font-bold text-primary mb-8">Manage Users</h2>

<div class="bg-white rounded-2xl shadow-xl p-6 mb-8">
    <form method="post" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label for="action" class="block text-typography font-semibold mb-2">Action:</label>
                <select name="action" id="action" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-primary focus:outline-none bg-white text-typography">
                    <option value="add">Add User</option>
                    <option value="update">Update User</option>
                    <option value="delete">Delete User</option>
                </select>
            </div>
            <div>
                <label for="user_type" class="block text-typography font-semibold mb-2">User Type:</label>
                <select name="user_type" id="user_type" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-primary focus:outline-none bg-white text-typography">
                    <option value="patient">Patient</option>
                    <option value="doctor">Doctor</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label for="username" class="block text-typography font-semibold mb-2">Username:</label>
                <input type="text" name="username" id="username" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-primary focus:outline-none bg-white text-typography" required>
            </div>
            <div>
                <label for="password" class="block text-typography font-semibold mb-2">Password:</label>
                <input type="password" name="password" id="password" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-primary focus:outline-none bg-white text-typography" required>
            </div>
        </div>
        <input type="hidden" name="user_id" id="user_id">
        <button type="submit" class="bg-action text-white px-8 py-3 rounded-xl font-semibold text-lg hover:bg-primary transition shadow-lg">
            Submit
        </button>
    </form>
</div>

<div class="bg-white rounded-2xl shadow-xl overflow-hidden">
    <table class="w-full text-left">
        <thead>
            <tr class="bg-primary text-white">
                <th class="px-6 py-4">Username</th>
                <th class="px-6 py-4">User Type</th>
                <th class="px-6 py-4">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr class="border-b border-gray-200 hover:bg-accent transition">
                <td class="px-6 py-4 text-typography font-semibold">{{ user.username }}</td>
                <td class="px-6 py-4 text-typography">{{ user.user_type }}</td>
                <td class="px-6 py-4">
                    <button onclick="editUser('{{ user.id }}', '{{ user.username }}', '{{ user.user_type }}')" class="bg-secondary text-white px-4 py-2 rounded-lg hover:bg-primary transition mr-2">
                        Edit
                    </button>
                    <button onclick="deleteUser('{{ user.id }}')" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition">
                        Delete
                    </button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
    function editUser(userId, username, userType) {
        document.getElementById('action').value = 'update';
        document.getElementById('user_id').value = userId;
        document.getElementById('username').value = username;
        document.getElementById('user_type').value = userType;
    }

    function deleteUser(userId) {
        document.getElementById('action').value = 'delete';
        document.getElementById('user_id').value = userId;
        document.forms[0].submit();
    }
</script>
{% endblock %}
